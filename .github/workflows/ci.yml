name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  minimal-build:
    name: Minimal build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Seal5
        run: python -m pip install .
      - name: Check Seal5 CLI
        run: seal5 --help

  unit-tests:
    name: Unit tests with coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Seal5 and coverage
        run: python -m pip install . coverage==7.6.1
      - name: Run unit tests with coverage
        run: coverage run --source=seal5 -m unittest discover -s tests
      - name: Report coverage
        run: coverage report --show-missing
