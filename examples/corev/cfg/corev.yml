---
models:
  XCoreVSimd:
    extensions:
      XCoreVSimd:
        backend_features: [FeatureGPR32V, FeatureGPR32VAdd, FeatureGPR32VSub, FeatureGPR32VCmp]
  XCoreVAlu:
    extensions:
      XCoreVAlu:
        backend_features: [FeatureSeal5MinMax32]
  XCoreVBitmanip:
    extensions:
      XCoreVBitmanip:
        backend_features: [FeatureSeal5Rotate32]
passes:
  overrides:
    explicit_memory_names:
      enabled: true
    explicit_register_names:
      enabled: true
    normalize_subscripts:
      enabled: true
    detect_branches:
      enabled: true
    check_pattern_support:
      allow_memory: true
      allow_branches: true
    behav_to_llvmir:
      no_extend: false
    behav_to_pat:
      no_extend: false
      parallel: false
      added_complexity: 1000  # Exercise generated rules even when native rules also match.
patches:
  - name: corev_bitwise_pattern_types
    target: llvm
    stage: 0
    priority: 0
    file: ../patches/llvm22-bitwise-pattern-types.patch
    comment: Reject scalar bitwise patterns with erased vector bitcasts before TableGen
    onlyif: "'Erasing a non-register bitcast must not produce a scalar bitwise' not in (settings.deps_dir / 'cdsl2llvm/llvm/lib/CodeGen/GlobalISel/PatternGen.cpp').read_text()"
  - name: corev_register_offset_asm
    target: llvm
    stage: 0
    file: ../patches/llvm22-register-offset-asm.patch
    comment: Parse generated register-offset memory operands
  - name: corev_packed_capabilities
    target: llvm
    stage: 0
    priority: 0  # Apply after PatternGen integration and insertion markers.
    file: ../patches/llvm22-packed-capabilities.patch
    comment: Supply packed operation capabilities until they reach the dependency branch
    onlyif: "'FeatureGPR32VAdd' not in (settings.deps_dir / 'cdsl2llvm/llvm/lib/Target/RISCV/RISCVFeatures.td').read_text()"
  - name: corev_mul_mask_cost
    target: llvm
    stage: 3  # The generated XCoreVMac subtarget feature must exist first.
    file: ../patches/llvm22-mul-mask-cost.patch
    comment: Keep low-half multiply masks visible for generated patterns
  - name: corev_clamp_pattern_variants
    target: llvm
    stage: 0
    priority: 0
    file: ../patches/llvm22-clamp-pattern-variants.patch
    comment: Extract equivalent clamp orders when their bounds are proven ordered
    onlyif: "'clampPatternVariants' not in (settings.deps_dir / 'cdsl2llvm/llvm/lib/CodeGen/GlobalISel/PatternGen.cpp').read_text()"
  - name: corev_rounded_pattern_variants
    target: llvm
    stage: 0
    priority: 0
    file: ../patches/llvm22-rounded-pattern-variants.patch
    comment: Match equivalent wrapping rounded-subtraction trees
    onlyif: "'roundedArithmeticPatternVariants' not in (settings.deps_dir / 'cdsl2llvm/llvm/lib/CodeGen/GlobalISel/PatternGen.cpp').read_text()"
  - name: corev_rotate_pattern_variants
    target: llvm
    stage: 0
    priority: 0
    file: ../patches/llvm22-rotate-pattern-variants.patch
    comment: Match plain rotates when a proven zero-count guard is redundant
    onlyif: "'rotatePatternVariants' not in (settings.deps_dir / 'cdsl2llvm/llvm/lib/CodeGen/GlobalISel/PatternGen.cpp').read_text()"
  - name: corev_narrow_register_offsets
    target: llvm
    stage: 0
    priority: 0
    file: ../patches/llvm22-narrow-register-offsets.patch
    comment: Preserve byte offsets in widened synthetic register loads
    onlyif: "'Widened any-extending loads still read the addressed register lane' not in (settings.deps_dir / 'cdsl2llvm/llvm/lib/CodeGen/GlobalISel/PatternGen.cpp').read_text()"
  - name: corev_fixed_vector_splats
    target: llvm
    stage: 0
    priority: 0
    file: ../patches/llvm22-fixed-vector-splats.patch
    comment: Allow generic splats for fixed vectors and retain verifier diagnostics
  - name: corev_packed_lane_combines
    target: llvm
    stage: 0
    priority: 0
    file: ../patches/llvm22-packed-lane-combines.patch
    comment: Canonicalize legal scalar packed lanes and redundant product extensions
    onlyif: "'matchPackedLaneCombine' not in (settings.deps_dir / 'cdsl2llvm/llvm/lib/Target/RISCV/GISel/RISCVPostLegalizerCombiner.cpp').read_text()"
  - name: corev_dynamic_slice_bounds
    target: llvm
    stage: 0
    priority: 0
    file: ../patches/llvm22-dynamic-slice-bounds.patch
    comment: Load local slice bounds before constructing integer expressions
    onlyif: "'promote_lvalue(build, upper);' not in (settings.deps_dir / 'cdsl2llvm/llvm/tools/pattern-gen/lib/Parser.cpp').read_text()"
