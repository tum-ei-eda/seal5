  <text x="36" y="983" fill="#526370" font-size="13" font-family="DejaVu Sans" font-weight="normal" text-anchor="start">Source: seal5/wrapper.py · seal5/flow.py. LLVM patch-phase definitions are provided in the separate TeX table.</text>
